<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wallet Connect</title>
    <script type="module">
      import { Web3Modal } from 'https://unpkg.com/@web3modal/html@3.6.1/dist/index.js?module';
      import { EthereumClient, walletConnectProvider } from 'https://unpkg.com/@web3modal/ethereum@3.6.1/dist/index.js?module';
      import { configureChains, createConfig } from 'https://unpkg.com/wagmi@1.6.6/dist/index.js?module';
      import { mainnet } from 'https://unpkg.com/wagmi@1.6.6/chains/mainnet.js?module';
      import { publicProvider } from 'https://unpkg.com/wagmi@1.6.6/providers/public.js?module';

      const projectId = '8f3eb896d127f6a619e7d78b1085647d';

      const chains = [mainnet];
      const { publicClient } = configureChains(chains, [
        walletConnectProvider({ projectId }),
        publicProvider()
      ]);

      const wagmiConfig = createConfig({
        autoConnect: true,
        publicClient
      });

      const ethereumClient = new EthereumClient(wagmiConfig, chains);

      const modal = new Web3Modal({ projectId }, ethereumClient);
    </script>
  </head>
  <body>
    <w3m-button></w3m-button>
  </body>
</html>
